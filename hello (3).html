<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jie Bai</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f4f4f1;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 52px 24px 48px;
    -webkit-font-smoothing: antialiased;
  }

  .say-hello {
    background: #1a1a18;
    color: #f4f4f1;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.03em;
    padding: 9px 16px;
    border-radius: 24px;
    text-decoration: none;
    transition: background 0.18s, transform 0.15s;
    white-space: nowrap;
  }
  .say-hello:hover { background: #6398c0; transform: scale(1.04); }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 360px;
    margin-bottom: 20px;
  }

  header { text-align: center; margin-bottom: 48px; }

  h1 {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 52px;
    font-weight: 700;
    color: #1a1a18;
    letter-spacing: -0.03em;
    margin-bottom: 12px;
    line-height: 1;
    text-align: left;
  }

  .tagline {
    font-size: 12px;
    color: #7a7874;
    line-height: 1.65;
    max-width: 268px;
    margin: 0 auto 14px;
    font-weight: 400;
  }

  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    justify-content: center;
  }

  .badge {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6398c0;
    border: 1px solid #6398c0;
    padding: 3px 9px;
    border-radius: 20px;
    font-weight: 500;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    width: 100%;
    max-width: 360px;
  }

  .icon-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    gap: 9px;
    transition: transform 0.18s ease;
  }
  .icon-link:hover { transform: translateY(-5px); }
  .icon-link:hover .icon-label { color: #b05c3a; }

  .icon-wrap { width: 100%; aspect-ratio: 1; }
  .icon-wrap svg { width: 100%; height: 100%; display: block; }

  .icon-label {
    font-size: 13px;
    color: #1a1a18;
    font-weight: 500;
    letter-spacing: -0.01em;
    transition: color 0.18s;
  }

  footer {
    margin-top: 48px;
    font-size: 10px;
    color: #a8a5a0;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    line-height: 2;
  }
</style>
</head>
